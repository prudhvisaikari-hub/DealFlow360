<svg width="680" height="410" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>DealFlow360 architecture</title>
<desc>Three user surfaces feed a Next.js app router layer, which calls four business-logic modules, which read and write a single JSON data store.</desc>
